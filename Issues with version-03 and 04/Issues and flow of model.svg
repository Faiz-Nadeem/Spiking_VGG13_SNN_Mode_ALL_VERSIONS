<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1840" viewBox="0 0 1500 1840"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52627a" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="60" y="62" font-family="Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#0f172a">DUAL-BRANCH SPIKING VGG-13</text><text x="60" y="97" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#475569">MILK10k | 11 classes | Forward pass + training loop | Your current LIF architecture</text><rect x="70" y="135" width="650" height="113" rx="16" fill="#eaf2ff" stroke="#9bbff0" stroke-width="1.6"/><text x="88" y="164" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">DERMOSCOPIC IMAGE</text><text x="88" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">RGB image -&gt; Resize (96 x 128) -&gt; Pad to 128 x 128</text><text x="88" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">ToTensor() -&gt; pixel values in [0, 1]</text><rect x="780" y="135" width="650" height="113" rx="16" fill="#e8f8f1" stroke="#8cd6b4" stroke-width="1.6"/><text x="798" y="164" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">CLINICAL CLOSE-UP IMAGE</text><text x="798" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Same lesion, paired with dermoscopic image</text><text x="798" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Same resize, pad and tensor conversion</text><path d="M395 248 L395 281" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><path d="M1105 248 L1105 281" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="70" y="285" width="650" height="110" rx="16" fill="#eaf2ff" stroke="#9bbff0" stroke-width="1.6"/><text x="88" y="314" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">POISSON / BERNOULLI ENCODING</text><text x="88" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Each pixel value p = probability of spike at each step</text><text x="88" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Example p=0.7 -&gt; sampled 0 or 1, at T1 ... T30</text><rect x="780" y="285" width="650" height="110" rx="16" fill="#e8f8f1" stroke="#8cd6b4" stroke-width="1.6"/><text x="798" y="314" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">POISSON / BERNOULLI ENCODING</text><text x="798" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Independently sample input spikes at each time step</text><text x="798" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">30 time steps; membrane states persist across steps</text><path d="M395 395 L395 430" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><path d="M1105 395 L1105 430" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="70" y="435" width="650" height="398" rx="16" fill="#eff5ff" stroke="#9bbff0" stroke-width="1.6"/><text x="90" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#152b48">DERM BRANCH</text><text x="90" y="502" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#18243b">Each block: Conv 3x3 -&gt; BN -&gt; LIF -&gt; Dropout2d(0.2)</text><text x="90" y="529" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#18243b">then Conv 3x3 -&gt; BN -&gt; LIF -&gt; Dropout2d(0.2)</text><text x="90" y="556" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#b45309">then AvgPool2d(2) [NOT MaxPool]</text><rect x="88" y="578" width="610" height="40" rx="8" fill="#fff" stroke="#9bbff0" stroke-width="1.6"/><text x="103" y="604" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 1</text><text x="325" y="604" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">64 x 64 x 64</text><rect x="88" y="625" width="610" height="40" rx="8" fill="#fff" stroke="#9bbff0" stroke-width="1.6"/><text x="103" y="651" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 2</text><text x="325" y="651" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">128 x 32 x 32</text><rect x="88" y="672" width="610" height="40" rx="8" fill="#fff" stroke="#9bbff0" stroke-width="1.6"/><text x="103" y="698" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 3</text><text x="325" y="698" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">256 x 16 x 16</text><rect x="88" y="719" width="610" height="40" rx="8" fill="#fff" stroke="#9bbff0" stroke-width="1.6"/><text x="103" y="745" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 4</text><text x="325" y="745" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">512 x 8 x 8</text><rect x="88" y="766" width="610" height="40" rx="8" fill="#fff" stroke="#9bbff0" stroke-width="1.6"/><text x="103" y="792" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 5</text><text x="325" y="792" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">512 x 4 x 4</text><rect x="780" y="435" width="650" height="398" rx="16" fill="#ecfaf3" stroke="#8cd6b4" stroke-width="1.6"/><text x="800" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#152b48">CLOSE-UP BRANCH</text><text x="800" y="502" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#18243b">Each block: Conv 3x3 -&gt; BN -&gt; LIF -&gt; Dropout2d(0.2)</text><text x="800" y="529" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#18243b">then Conv 3x3 -&gt; BN -&gt; LIF -&gt; Dropout2d(0.2)</text><text x="800" y="556" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#b45309">then AvgPool2d(2) [NOT MaxPool]</text><rect x="798" y="578" width="610" height="40" rx="8" fill="#fff" stroke="#8cd6b4" stroke-width="1.6"/><text x="813" y="604" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 1</text><text x="1035" y="604" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">64 x 64 x 64</text><rect x="798" y="625" width="610" height="40" rx="8" fill="#fff" stroke="#8cd6b4" stroke-width="1.6"/><text x="813" y="651" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 2</text><text x="1035" y="651" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">128 x 32 x 32</text><rect x="798" y="672" width="610" height="40" rx="8" fill="#fff" stroke="#8cd6b4" stroke-width="1.6"/><text x="813" y="698" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 3</text><text x="1035" y="698" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">256 x 16 x 16</text><rect x="798" y="719" width="610" height="40" rx="8" fill="#fff" stroke="#8cd6b4" stroke-width="1.6"/><text x="813" y="745" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 4</text><text x="1035" y="745" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">512 x 8 x 8</text><rect x="798" y="766" width="610" height="40" rx="8" fill="#fff" stroke="#8cd6b4" stroke-width="1.6"/><text x="813" y="792" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#0f172a">Block 5</text><text x="1035" y="792" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155">512 x 4 x 4</text><path d="M395 833 L395 875" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><path d="M1105 833 L1105 875" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="70" y="880" width="650" height="98" rx="16" fill="#eaf2ff" stroke="#9bbff0" stroke-width="1.6"/><text x="88" y="909" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">FLATTEN</text><text x="88" y="935" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">512 x 4 x 4 = 8,192 features per time step</text><rect x="780" y="880" width="650" height="98" rx="16" fill="#e8f8f1" stroke="#8cd6b4" stroke-width="1.6"/><text x="798" y="909" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">FLATTEN</text><text x="798" y="935" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">512 x 4 x 4 = 8,192 features per time step</text><path d="M395 978 L395 1009" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><path d="M1105 978 L1105 1009" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="430" y="1015" width="640" height="93" rx="16" fill="#f3eefe" stroke="#c5b0f0" stroke-width="1.6"/><text x="448" y="1044" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">FUSION (CONCATENATION)</text><text x="448" y="1070" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">8,192 + 8,192 = 16,384 features</text><path d="M395 1009 L395 1038 L430 1038 M1105 1009 L1105 1038 L1070 1038" fill="none" stroke="#52627a" stroke-width="2"/><path d="M750 1108 L750 1140" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="430" y="1145" width="640" height="110" rx="16" fill="#fff4e7" stroke="#f4be77" stroke-width="1.6"/><text x="448" y="1174" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">CLASSIFICATION HEAD</text><text x="448" y="1200" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">FC1: 16,384 -&gt; 1,024 -&gt; LIF(beta=0.9) -&gt; Dropout(0.5)</text><text x="448" y="1225" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">FC2: 1,024 -&gt; 11 -&gt; LIF(beta=0.9, threshold=1.0)</text><path d="M750 1255 L750 1287" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="430" y="1292" width="640" height="114" rx="16" fill="#feeef0" stroke="#f5a9b3" stroke-width="1.6"/><text x="448" y="1321" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">OUTPUT READOUT — CURRENT V3/V4</text><text x="448" y="1347" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Add FC2 output spikes over T1 ... T30 -&gt; 11 spike counts</text><text x="448" y="1372" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Return spike_counts; argmax selects predicted class</text><rect x="70" y="1145" width="315" height="261" rx="16" fill="#fff" stroke="#d7e1ed" stroke-width="1.6"/><text x="90" y="1181" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#14243e">WHAT BN AND DROPOUT DO</text><text x="90" y="1212" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">BatchNorm2d: rescales/shifts</text><text x="90" y="1237" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">conv outputs using batch</text><text x="90" y="1262" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">statistics during training.</text><text x="90" y="1287" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Dropout2d: masks feature</text><text x="90" y="1312" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">channels during training.</text><text x="90" y="1337" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Dropout(0.5): masks FC1</text><text x="90" y="1362" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">spike activations.</text><text x="90" y="1387" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Both act differently in eval().</text><rect x="1115" y="1145" width="315" height="261" rx="16" fill="#fff" stroke="#d7e1ed" stroke-width="1.6"/><text x="1135" y="1181" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#14243e">WHY FC2 WAS SILENT</text><text x="1135" y="1212" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Observed in IF test:</text><text x="1135" y="1237" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">FC1 spikes: 39,384</text><text x="1135" y="1262" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">FC2 spikes: 0</text><text x="1135" y="1287" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">FC2 max membrane: 0.0272</text><text x="1135" y="1312" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Threshold: 1.0</text><text x="1135" y="1337" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">All output counts: 0</text><text x="1135" y="1362" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">-&gt; argmax picks class 0</text><text x="1135" y="1387" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Not proof of root cause.</text><path d="M750 1406 L750 1440" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="70" y="1445" width="1360" height="325" rx="16" fill="#f0f4fa" stroke="#cbd5e1" stroke-width="1.6"/><text x="95" y="1484" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#14243e">TRAINING LOOP — ONE BATCH (repeats over batches / epochs)</text><rect x="93" y="1515" width="245" height="105" rx="16" fill="#fff" stroke="#b7c7da" stroke-width="1.6"/><text x="111" y="1544" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">1  Forward</text><text x="111" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">30 steps; output</text><path d="M339 1568 L360 1568" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="362" y="1515" width="245" height="105" rx="16" fill="#fff" stroke="#b7c7da" stroke-width="1.6"/><text x="380" y="1544" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">2  Loss</text><text x="380" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">CrossEntropyLoss</text><path d="M608 1568 L629 1568" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="631" y="1515" width="245" height="105" rx="16" fill="#fff" stroke="#b7c7da" stroke-width="1.6"/><text x="649" y="1544" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">3  Backward</text><text x="649" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">Surrogate gradients</text><path d="M877 1568 L898 1568" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="900" y="1515" width="245" height="105" rx="16" fill="#fff" stroke="#b7c7da" stroke-width="1.6"/><text x="918" y="1544" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">4  Clip (optional)</text><text x="918" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">max_norm = 1.0</text><path d="M1146 1568 L1167 1568" fill="none" stroke="#52627a" stroke-width="2.3" marker-end="url(#a)"/><rect x="1169" y="1515" width="245" height="105" rx="16" fill="#fff" stroke="#b7c7da" stroke-width="1.6"/><text x="1187" y="1544" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#14243e">5  SGD update</text><text x="1187" y="1570" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#475569">learning rate 0.003</text><text x="98" y="1663" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#334155">Current loss input: 11 spike counts. Proposed V5 test: use FC2 membrane-based scores for loss.</text><text x="98" y="1693" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#334155">Surrogate gradients permit backpropagation through spiking neurons; SGD updates trainable weights.</text><text x="98" y="1723" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#334155">During validation: model.eval() disables dropout and uses BatchNorm running statistics.</text><text x="70" y="1810" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#64748b">NOTE: Proposed membrane-potential loss is NOT yet implemented in this diagram; current code returns spike counts.</text></svg>